---
version: 0.1

globalTimeout: 150
testSuiteTimeout: 150
testSuiteStep: 150

runson: linux

autosplit: true

retryOnFailure: false
maxRetries: 2

concurrency: 4

runtime:
  language: java
  version: 17


#setting up server in the background
background:
  - mvn test -Dtest=LocalRunner -Dmaven.repo.local=m2 -o || true


report: true
partialReports:
  location: target
  type: html
  frameworkName: karate
  email:
    to: [ ltqa@ltqa.lambdatestautomation.com, ambarg@lambdatest.com ]


pre:
  # Skip execution of the tests in the pre step
  - ls
  - mvn install  -Dmaven.repo.local=m2 -o -Dmaven.test.skip=true

uploadArtefacts:
  - name: ExecutionSnapshots
    path:
      - target/
mergeArtifacts: true


testDiscovery:
  type: raw
  mode: dynamic
  command: grep -rl --include="*.feature" "" src/test/java/app

scenarioCommandStatusOnly: true

#Stopping the server
post:
  - curl http://localhost:9826/__admin/stop


testRunnerCommand: mvn test -Dtest=MyApiRunner -DFeaturePath="$test" -Dmaven.repo.local=m2 -o

jobLabel : [karate, offlinemode, linux]
