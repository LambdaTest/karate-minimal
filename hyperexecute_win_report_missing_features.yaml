version: 0.1
runson: win

autosplit: true
concurrency: 1

alwaysRunPostSteps: true

runtime:
  language: java
  version: 17

testDiscovery:
  type: raw
  mode: dynamic
  command: grep -rl --include="*.feature" "" src/test/resources/apis/features

testRunnerCommand: .\\gradlew.bat test --tests APIRunner `-Dkarate.options="$test"

jobLabel: ['karate-gradle', 'report-missing-features', 'win']

scenarioCommandStatusOnly: true

report: true
partialReports:
  location: build/karate-reports
  type: html
  frameworkName: karate

uploadArtefacts:
  - name: Karate Report
    path:
      - build/karate-reports/
  - name: Build Output
    path:
      - build/

cacheKey: '{{ checksum "build.gradle" }}'
cacheDirectories:
  - .gradle
  - gradle/wrapper

pre:
  - echo "Starting Karate Gradle Test (Windows - Missing Features)..."
  - .\\gradlew.bat dependencies --refresh-dependencies --gradle-user-home=.gradle --no-daemon
