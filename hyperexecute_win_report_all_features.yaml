version: 0.1
runson: win

autosplit: true
concurrency: 1

alwaysRunPostSteps: true

runtime:
  language: java
  version: 17

testDiscovery:
  type: raw
  mode: remote
  command: echo "classpath:nested/features/Main.feature"

testRunnerCommand: .\\gradlew.bat test --tests APIRunner `-Dkarate.options=$test --no-daemon

jobLabel: ['karate-gradle', 'report-all-features', 'win']

scenarioCommandStatusOnly: true

report: true
partialReports:
  location: build
  type: html
  frameworkName: karate

uploadArtefacts:
  - name: Karate Report
    path:
      - build/karate-reports/
  - name: Feature Files
    path:
      - src/

cacheKey: '{{ checksum "build.gradle" }}'
cacheDirectories:
  - .gradle

pre:
  - echo "Starting Karate Gradle Test (Windows - All Features)..."
  - .\\gradlew.bat dependencies --refresh-dependencies --gradle-user-home=.gradle --no-daemon
